name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for CI only.
  DATABASE_URL: postgresql://paybridge:paybridge@localhost:5432/paybridge
  TEST_DATABASE_URL: postgresql://paybridge:paybridge@localhost:5432/paybridge_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-ci-only
  DATA_ENCRYPTION_KEY: Y2ktb25seS1jaGFuZ2UtbWUtMzItYnl0ZXMtbG9uZyE=
  FINGERPRINT_HMAC_KEY: ci-only-fingerprint-key-ci-only-fingerprint
  WEBHOOK_SIGNING_SECRET: ci-only-webhook-secret-ci-only-webhook-secret

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: paybridge, POSTGRES_PASSWORD: paybridge, POSTGRES_DB: paybridge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U paybridge" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @paybridge/shared build && pnpm --filter @paybridge/database build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: |
          PGPASSWORD=paybridge psql -h localhost -U paybridge -d paybridge -c 'CREATE DATABASE paybridge_test'
          pnpm test:int

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: |
          pnpm db:migrate
          APP_ENV=development QUEUE_DRIVER=inline pnpm db:seed
          pnpm --filter @paybridge/web exec playwright install --with-deps chromium
          pnpm test:e2e
        env:
          APP_ENV: development
          QUEUE_DRIVER: inline
          WEBHOOK_TARGET_URL: http://localhost:4000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/api.Dockerfile, push: false, tags: paybridge-api:ci }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/web.Dockerfile, push: false, tags: paybridge-web:ci }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# There is deliberately no deploy job. Releases are a manual, human decision.
